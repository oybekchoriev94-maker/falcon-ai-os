name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: falcon_test
          POSTGRES_USER: falcon
          POSTGRES_PASSWORD: falcon-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U falcon -d falcon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        node-version: [20, 22]

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://falcon:falcon-test@localhost:5432/falcon_test
      TEST_DATABASE_URL: postgresql://falcon:falcon-test@localhost:5432/falcon_test
      JWT_SECRET: ci-jwt-secret-32-chars-test-only-123456
      INTERNAL_SECRET: ci-internal-secret-32-chars-test-123456
      ADMIN_PASSWORD: TestAdmin123
      SEED_ADMIN_PASSWORD: TestAdmin123
      SEED_CEO_PASSWORD: ceo-change-me-now
      SEED_RECEPTION_PASSWORD: reception-test-only
      SEED_DOCTOR_PASSWORD: doctor-test-only

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Run migrations
        run: npx knex migrate:latest --env test

      - run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage/
        if: always()

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - run: npm run build
        working-directory: ./frontend

  docker:
    needs: [test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push (backend)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/falcon-ai-os:latest
            ${{ secrets.DOCKER_USERNAME }}/falcon-ai-os:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (frontend)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/falcon-ai-os-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/falcon-ai-os-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/falcon-ai-os
            git pull
            docker compose pull
            docker compose up -d --force-recreate
            docker system prune -f
            echo "Deploy complete: $(date)"
