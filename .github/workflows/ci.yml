name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: falcon_test
          POSTGRES_USER: falcon
          POSTGRES_PASSWORD: falcon-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U falcon -d falcon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        node-version: [20, 22]

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://falcon_app:falcon-app-test-password@localhost:5432/falcon_test
      TEST_DATABASE_URL: postgresql://falcon_app:falcon-app-test-password@localhost:5432/falcon_test
      PLATFORM_DATABASE_URL: postgresql://falcon:falcon-test@localhost:5432/falcon_test
      MIGRATION_DATABASE_URL: postgresql://falcon:falcon-test@localhost:5432/falcon_test
      APP_DATABASE_PASSWORD: falcon-app-test-password
      RLS_ENFORCE_APP_ROLE: "true"
      JWT_SECRET: ci-jwt-secret-32-chars-test-only-123456
      INTERNAL_SECRET: ci-internal-secret-32-chars-test-123456
      ADMIN_PASSWORD: TestAdmin123
      SEED_ADMIN_PASSWORD: TestAdmin123
      SEED_CEO_PASSWORD: ceo-change-me-now
      SEED_RECEPTION_PASSWORD: reception-test-only
      SEED_DOCTOR_PASSWORD: doctor-test-only

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Run migrations
        run: npx knex migrate:latest --env test

      - name: Provision non-owner application role
        run: node scripts/provision-app-role.js

      - run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage/
        if: always()

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - run: npm run build
        working-directory: ./frontend

  docker:
    needs: [test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (backend)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os:latest
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (frontend)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os-frontend:latest
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (STT)
        uses: docker/build-push-action@v5
        with:
          context: ./stt-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os-stt:latest
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os-stt:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_NAMESPACE,IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/falcon-ai-os
            git fetch origin main
            git switch main
            git merge --ff-only origin/main
            export BACKEND_IMAGE="${IMAGE_NAMESPACE}/falcon-ai-os:${IMAGE_TAG}"
            export FRONTEND_IMAGE="${IMAGE_NAMESPACE}/falcon-ai-os-frontend:${IMAGE_TAG}"
            export STT_IMAGE="${IMAGE_NAMESPACE}/falcon-ai-os-stt:${IMAGE_TAG}"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose pull app frontend stt db caddy
            docker compose up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 900
            docker compose ps
            docker system prune -f
            echo "Deploy complete: ${IMAGE_TAG} $(date)"
