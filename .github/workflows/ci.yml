name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: falcon_test
          POSTGRES_USER: falcon
          POSTGRES_PASSWORD: falcon-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U falcon -d falcon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        node-version: [20, 22]

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://falcon_app:falcon-app-test-password@localhost:5432/falcon_test
      TEST_DATABASE_URL: postgresql://falcon_app:falcon-app-test-password@localhost:5432/falcon_test
      PLATFORM_DATABASE_URL: postgresql://falcon:falcon-test@localhost:5432/falcon_test
      MIGRATION_DATABASE_URL: postgresql://falcon:falcon-test@localhost:5432/falcon_test
      APP_DATABASE_PASSWORD: falcon-app-test-password
      RLS_ENFORCE_APP_ROLE: "true"
      JWT_SECRET: ci-jwt-secret-32-chars-test-only-123456
      INTERNAL_SECRET: ci-internal-secret-32-chars-test-123456
      EDGE_INGEST_ENABLED: "true"
      EDGE_KEY_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_PASSWORD: TestAdmin123
      SEED_ADMIN_PASSWORD: TestAdmin123
      SEED_CEO_PASSWORD: ceo-change-me-now
      SEED_RECEPTION_PASSWORD: reception-test-only
      SEED_DOCTOR_PASSWORD: doctor-test-only

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Run migrations
        run: npx knex migrate:latest --env test

      - name: Provision non-owner application role
        run: node scripts/provision-app-role.js

      - run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage/
        if: always()

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - run: npm run build
        working-directory: ./frontend

  docker:
    needs: [test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (backend)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os:latest
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (frontend)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os-frontend:latest
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (STT)
        uses: docker/build-push-action@v5
        with:
          context: ./stt-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os-stt:latest
            ${{ env.IMAGE_NAMESPACE }}/falcon-ai-os-stt:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      STAGE_DIR: /tmp/falcon-ai-os-deploy-${{ github.run_id }}
      DEPLOY_RUN_ID: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Stage production compose manifest
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ env.STAGE_DIR }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          STAGE_DIR: ${{ env.STAGE_DIR }}
          DEPLOY_RUN_ID: ${{ env.DEPLOY_RUN_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_NAMESPACE,IMAGE_TAG,STAGE_DIR,DEPLOY_RUN_ID
          script: |
            set -euo pipefail
            cd /opt/falcon-ai-os
            case "$STAGE_DIR" in
              /tmp/falcon-ai-os-deploy-[0-9]*) ;;
              *) echo "Invalid staging path"; exit 1 ;;
            esac
            test -f "$STAGE_DIR/docker-compose.yml"
            test -f .env
            test "$(df --output=avail -B1 / | tail -1)" -gt 2147483648

            export BACKEND_IMAGE="${IMAGE_NAMESPACE}/falcon-ai-os:${IMAGE_TAG}"
            export FRONTEND_IMAGE="${IMAGE_NAMESPACE}/falcon-ai-os-frontend:${IMAGE_TAG}"
            export STT_IMAGE="${IMAGE_NAMESPACE}/falcon-ai-os-stt:${IMAGE_TAG}"

            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_dir="/opt/falcon-ai-os/backups/deploy/$stamp"
            install -d -m 0700 "$backup_dir"
            cp -a docker-compose.yml "$backup_dir/docker-compose.yml"
            cp -a .env "$backup_dir/.env"
            docker compose exec -T db pg_dump -U falcon -d falcon_ai_os -Fc > "$backup_dir/falcon_ai_os.dump"
            test -s "$backup_dir/falcon_ai_os.dump"
            chmod 0600 "$backup_dir/falcon_ai_os.dump"

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            preflight_db="falcon_preflight_${DEPLOY_RUN_ID}"
            cleanup() {
              if [ -n "${preflight_db:-}" ]; then
                docker compose exec -T db dropdb -U falcon --if-exists "$preflight_db" >/dev/null 2>&1 || true
              fi
              docker logout ghcr.io >/dev/null 2>&1 || true
              rm -rf "$STAGE_DIR"
            }
            trap cleanup EXIT

            docker pull "$BACKEND_IMAGE"
            docker run --rm --env-file .env \
              -e NODE_ENV=production \
              -e DATABASE_URL=postgresql://falcon_app:validation-only@db:5432/falcon_validation \
              -e PLATFORM_DATABASE_URL=postgresql://falcon:validation-only@db:5432/falcon_validation \
              -e RLS_ENFORCE_APP_ROLE=true \
              "$BACKEND_IMAGE" node --input-type=module -e \
              'import("./backend/production-env.js").then(({ validateProductionEnvironment }) => validateProductionEnvironment())'

            docker compose exec -T db createdb -U falcon "$preflight_db"
            docker compose exec -T db pg_restore -U falcon -d "$preflight_db" --no-owner --no-privileges < "$backup_dir/falcon_ai_os.dump"
            postgres_password="$(docker compose exec -T db printenv POSTGRES_PASSWORD)"
            network_name="$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' falcon-ai-os-db-1)"
            docker run --rm --network "$network_name" \
              -e NODE_ENV=production \
              -e DB_NAME="$preflight_db" \
              -e DB_PASSWORD="$postgres_password" \
              "$BACKEND_IMAGE" sh -ceu \
              'encoded_password="$(node -p "encodeURIComponent(process.env.DB_PASSWORD)")"; export MIGRATION_DATABASE_URL="postgresql://falcon:${encoded_password}@db:5432/${DB_NAME}"; export DATABASE_URL="$MIGRATION_DATABASE_URL"; node scripts/migrate.js'
            docker compose exec -T db dropdb -U falcon "$preflight_db"
            preflight_db=""

            if ! grep -qE '^APP_DATABASE_PASSWORD=.+$' .env; then
              umask 077
              printf '\nAPP_DATABASE_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> .env
            fi
            chmod 0600 .env
            install -m 0644 "$STAGE_DIR/docker-compose.yml" docker-compose.yml
            docker compose config --quiet

            docker compose pull app db-bootstrap frontend stt db caddy
            docker compose up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 900
            docker compose ps --all
            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-app-1)" = "healthy"
            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-db-1)" = "healthy"
            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-stt-1)" = "healthy"
            echo "Deploy complete: ${IMAGE_TAG} $(date)"
            echo "Backup: $backup_dir"
