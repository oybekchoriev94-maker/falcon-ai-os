name: Rescue SSH recovery

on:
  push:
    branches: [ops/rescue-ssh-recovery]
    paths: [.github/workflows/rescue-ssh-recovery.yml]

permissions:
  contents: read

jobs:
  rollback-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restore pre-deploy compose and environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/falcon-ai-os

            backup_dir="$(find /opt/falcon-ai-os/backups/deploy -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            case "$backup_dir" in
              /opt/falcon-ai-os/backups/deploy/20*) ;;
              *) echo "Invalid backup path"; exit 1 ;;
            esac
            test -s "$backup_dir/docker-compose.yml"
            test -s "$backup_dir/.env"
            test -s "$backup_dir/falcon_ai_os.dump"

            cp -a "$backup_dir/docker-compose.yml" docker-compose.yml
            cp -a "$backup_dir/.env" .env
            docker compose config --quiet
            docker compose up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 900
            docker compose ps --all

            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-app-1)" = "healthy"
            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-db-1)" = "healthy"
            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-stt-1)" = "healthy"
            echo "ROLLBACK_COMPLETE=1"
            echo "RESTORED_FROM=$backup_dir"
