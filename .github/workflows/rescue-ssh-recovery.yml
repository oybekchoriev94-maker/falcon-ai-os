name: Rescue SSH recovery

on:
  push:
    branches: [ops/rescue-ssh-recovery]
    paths: [.github/workflows/rescue-ssh-recovery.yml]

permissions:
  contents: read

jobs:
  inspect-env:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required environment names without reading values
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            cd /opt/falcon-ai-os
            test -f .env
            for name in POSTGRES_PASSWORD APP_DATABASE_PASSWORD JWT_SECRET INTERNAL_SECRET SEED_CEO_PASSWORD SEED_ADMIN_PASSWORD SEED_RECEPTION_PASSWORD SEED_DOCTOR_PASSWORD ADMIN_PASSWORD; do
              if grep -qE "^$name=.+$" .env; then
                echo "$name=present"
              else
                echo "$name=missing"
              fi
            done
