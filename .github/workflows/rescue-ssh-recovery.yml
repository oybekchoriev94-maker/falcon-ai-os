name: Rescue SSH recovery

on:
  push:
    branches: [ops/rescue-ssh-recovery]
    paths: [.github/workflows/rescue-ssh-recovery.yml]

permissions:
  contents: read

jobs:
  repair-production-env:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Rotate weak seed secrets and finish deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/falcon-ai-os
            test -f .env

            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            install -d -m 0700 backups/deploy
            cp -a .env "backups/deploy/env-before-seed-rotation-$stamp"

            set_secret() {
              name="$1"
              value="$(openssl rand -hex 24)"
              if grep -qE "^$name=" .env; then
                sed -i "s|^$name=.*|$name=$value|" .env
              else
                printf '%s=%s\n' "$name" "$value" >> .env
              fi
            }

            set_secret SEED_CEO_PASSWORD
            set_secret SEED_ADMIN_PASSWORD
            set_secret SEED_DOCTOR_PASSWORD
            chmod 0600 .env

            docker compose config --quiet
            docker compose up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 900
            docker compose ps --all

            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-app-1)" = "healthy"
            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-db-1)" = "healthy"
            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-stt-1)" = "healthy"
            echo "PRODUCTION_RECOVERY_COMPLETE=1"
