name: Rescue SSH recovery

on:
  push:
    branches: [ops/rescue-ssh-recovery]
    paths: [.github/workflows/rescue-ssh-recovery.yml]

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public HTTPS readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://falconmedai.uz/api/health/ready
          curl --fail --silent --show-error --head --max-time 20 https://falconmedai.uz/

      - name: Verify VPS service health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            cd /opt/falcon-ai-os
            docker compose ps --all
            docker inspect -f 'APP={{.State.Health.Status}} IMAGE={{.Config.Image}}' falcon-ai-os-app-1
            docker inspect -f 'DB={{.State.Health.Status}} IMAGE={{.Config.Image}}' falcon-ai-os-db-1
            docker inspect -f 'STT={{.State.Health.Status}} IMAGE={{.Config.Image}}' falcon-ai-os-stt-1
            docker inspect -f 'FRONTEND={{.State.Health.Status}} IMAGE={{.Config.Image}}' falcon-ai-os-frontend-1
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/api/health/ready
