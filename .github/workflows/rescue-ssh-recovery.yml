name: Rescue SSH recovery

on:
  push:
    branches: [ops/rescue-ssh-recovery]
    paths: [.github/workflows/rescue-ssh-recovery.yml]

permissions:
  contents: read

jobs:
  finish-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start exact immutable production images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/falcon-ai-os
            export BACKEND_IMAGE="ghcr.io/oybekchoriev94-maker/falcon-ai-os:2b240fe1501e93fa0460d537d277c734f81ac8ca"
            export FRONTEND_IMAGE="ghcr.io/oybekchoriev94-maker/falcon-ai-os-frontend:2b240fe1501e93fa0460d537d277c734f81ac8ca"
            export STT_IMAGE="ghcr.io/oybekchoriev94-maker/falcon-ai-os-stt:2b240fe1501e93fa0460d537d277c734f81ac8ca"

            docker image inspect "$BACKEND_IMAGE" >/dev/null
            docker image inspect "$FRONTEND_IMAGE" >/dev/null
            docker image inspect "$STT_IMAGE" >/dev/null
            docker compose config --quiet
            docker compose up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 900
            docker compose ps --all

            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-app-1)" = "healthy"
            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-db-1)" = "healthy"
            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-stt-1)" = "healthy"
            echo "PRODUCTION_DEPLOY_COMPLETE=2b240fe1501e93fa0460d537d277c734f81ac8ca"
