name: Rescue SSH recovery

on:
  push:
    branches: [ops/rescue-ssh-recovery]
    paths: [.github/workflows/rescue-ssh-recovery.yml]

permissions:
  contents: read
  packages: read

jobs:
  deploy-immutable-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_SHA: 2731c80760dc2699b71b5a00e65b05c9e3607787
      IMAGE_NAMESPACE: ghcr.io/oybekchoriev94-maker
      STAGE_DIR: /tmp/falcon-ai-os-deploy-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage current production compose manifest
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ env.STAGE_DIR }}

      - name: Back up and deploy immutable images
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          STAGE_DIR: ${{ env.STAGE_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_SHA,IMAGE_NAMESPACE,STAGE_DIR
          script: |
            set -euo pipefail
            cd /opt/falcon-ai-os
            test -f "$STAGE_DIR/docker-compose.yml"
            test -f .env
            test "$(df --output=avail -B1 / | tail -1)" -gt 2147483648

            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_dir="/opt/falcon-ai-os/backups/deploy/$stamp"
            install -d -m 0700 "$backup_dir"
            cp -a docker-compose.yml "$backup_dir/docker-compose.yml"
            cp -a .env "$backup_dir/.env"

            echo "Creating PostgreSQL pre-deploy backup"
            docker compose exec -T db pg_dump -U falcon -d falcon_ai_os -Fc > "$backup_dir/falcon_ai_os.dump"
            test -s "$backup_dir/falcon_ai_os.dump"
            chmod 0600 "$backup_dir/falcon_ai_os.dump"

            if ! grep -qE '^APP_DATABASE_PASSWORD=.+$' .env; then
              umask 077
              printf '\nAPP_DATABASE_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> .env
            fi
            chmod 0600 .env

            install -m 0644 "$STAGE_DIR/docker-compose.yml" docker-compose.yml
            export BACKEND_IMAGE="$IMAGE_NAMESPACE/falcon-ai-os:$DEPLOY_SHA"
            export FRONTEND_IMAGE="$IMAGE_NAMESPACE/falcon-ai-os-frontend:$DEPLOY_SHA"
            export STT_IMAGE="$IMAGE_NAMESPACE/falcon-ai-os-stt:$DEPLOY_SHA"

            docker compose config --quiet
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$STAGE_DIR"' EXIT

            docker compose pull app db-bootstrap frontend stt db caddy
            docker compose up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 900
            docker compose ps --all

            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-app-1)" = "healthy"
            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-db-1)" = "healthy"
            test "$(docker inspect -f '{{.State.Health.Status}}' falcon-ai-os-stt-1)" = "healthy"

            docker system prune -f
            echo "DEPLOY_COMPLETE=$DEPLOY_SHA"
            echo "BACKUP_DIR=$backup_dir"
