name: Rescue SSH recovery

on:
  push:
    branches: [ops/rescue-ssh-recovery]
    paths: [.github/workflows/rescue-ssh-recovery.yml]

permissions:
  contents: read

jobs:
  diagnose-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read db-bootstrap status and logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            cd /opt/falcon-ai-os
            docker compose ps --all
            echo "DB_BOOTSTRAP_LOG_BEGIN"
            docker compose logs --no-color --tail=240 db-bootstrap
            echo "DB_BOOTSTRAP_LOG_END"
