name: Rescue SSH recovery

on:
  push:
    branches: [ops/rescue-ssh-recovery]
    paths: [.github/workflows/rescue-ssh-recovery.yml]

permissions:
  contents: read

jobs:
  install-deploy-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install deploy key on original root disk
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            test "$(hostname)" = "rescue"
            test "$(lsblk -nro FSTYPE /dev/sda1)" = "ext4"

            mountpoint_dir=/mnt/falcon-root
            install -d -m 0755 "$mountpoint_dir"
            mount -o rw /dev/sda1 "$mountpoint_dir"
            trap 'umount "$mountpoint_dir"' EXIT

            test -f "$mountpoint_dir/etc/os-release"
            install -d -m 0700 -o 0 -g 0 "$mountpoint_dir/root/.ssh"
            touch "$mountpoint_dir/root/.ssh/authorized_keys"
            chmod 0600 "$mountpoint_dir/root/.ssh/authorized_keys"
            chown 0:0 "$mountpoint_dir/root/.ssh/authorized_keys"

            deploy_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB+lWM7kHkptOPFgSqwvuUzbmd8F5+aoXnqlqAR1RGGH github-actions-falcon-ai-os'
            grep -qxF "$deploy_key" "$mountpoint_dir/root/.ssh/authorized_keys" ||
              printf '%s\n' "$deploy_key" >> "$mountpoint_dir/root/.ssh/authorized_keys"

            sync
            grep -qxF "$deploy_key" "$mountpoint_dir/root/.ssh/authorized_keys"
            echo "DEPLOY_KEY_INSTALLED=1"
            umount "$mountpoint_dir"
            trap - EXIT
