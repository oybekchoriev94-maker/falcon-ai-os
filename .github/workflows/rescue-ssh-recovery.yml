name: Rescue SSH recovery

on:
  push:
    branches: [ops/rescue-ssh-recovery]
    paths: [.github/workflows/rescue-ssh-recovery.yml]

permissions:
  contents: read

jobs:
  inspect-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current compose image configuration
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            cd /opt/falcon-ai-os
            echo "COMPOSE_IMAGES_BEGIN"
            docker compose config --images
            echo "COMPOSE_IMAGES_END"
            grep -nE '^[[:space:]]+(image|build):' docker-compose.yml || true
