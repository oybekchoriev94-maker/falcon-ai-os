name: Rescue SSH recovery

on:
  push:
    branches: [ops/rescue-ssh-recovery]
    paths: [.github/workflows/rescue-ssh-recovery.yml]

permissions:
  contents: read

jobs:
  verify-normal-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify normal OS SSH and deployment prerequisites
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            test "$(hostname)" != "rescue"
            echo "NORMAL_BOOT=1"
            hostname
            uname -a
            test -d /opt/falcon-ai-os
            test -f /opt/falcon-ai-os/docker-compose.yml
            command -v git
            command -v docker
            cd /opt/falcon-ai-os
            git status --short --branch
            docker compose ps
            df -h /
            free -m
