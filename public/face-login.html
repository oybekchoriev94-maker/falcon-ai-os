<!DOCTYPE html>
<html lang="uz">
<head><meta charset="utf-8"><title>Face ID — Login</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:32px;max-width:400px;width:100%}
h1{font-size:20px;margin:0 0 8px;text-align:center}
p{color:#8b949e;font-size:14px;text-align:center;margin:0 0 24px}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px;margin-bottom:12px;box-sizing:border-box}
input:focus{outline:none;border-color:#58a6ff}
button{width:100%;padding:12px;border:none;border-radius:10px;background:#238636;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#2ea043}
.error{color:#f85149;font-size:13px;text-align:center;margin-top:12px;display:none}
.loading{display:none;text-align:center;color:#8b949e;font-size:14px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h1>🔵 Face ID</h1>
  <p>Falcon AI OS — Kiosk tizimiga kirish</p>
  <input type="text" id="username" placeholder="Login" value="admin">
  <input type="password" id="password" placeholder="Parol" value="admin123">
  <button onclick="doLogin()">🔑 Kirish</button>
  <div class="loading" id="loading">Kirish tekshirilmoqda...</div>
  <div class="error" id="error"></div>
</div>
<script>
async function doLogin() {
  const btn = document.querySelector('button');
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');
  btn.disabled = true;
  loading.style.display = 'block';
  error.style.display = 'none';

  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const data = await resp.json();
    if (data.success && data.token) {
      localStorage.setItem('falcon_token', data.token);
      window.location.href = 'face-kiosk.html';
    } else {
      error.textContent = data.error || 'Login xatosi';
      error.style.display = 'block';
      btn.disabled = false;
      loading.style.display = 'none';
    }
  } catch (e) {
    error.textContent = 'Server bilan bog\'lanmadi';
    error.style.display = 'block';
    btn.disabled = false;
    loading.style.display = 'none';
  }
}
</script>
</body>
</html>
