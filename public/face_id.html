<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Face ID — Falcon AI OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/index.css">
  <script src="/face-capture.js"></script>
</head>
<body>
<div class="max-w-4xl mx-auto p-4 pb-24">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">🪪 Face ID</h1>
      <p class="text-sm opacity-50">Falcon AI OS — Yuzni tanish tizimi</p>
    </div>
    <div class="flex gap-2">
      <span id="modelStatus" class="px-3 py-1 rounded-full bg-yellow-900/40 text-yellow-400 text-xs">⏳ Yuklanmoqda...</span>
      <button id="authBtn" onclick="handleAuth()" class="px-3 py-1 rounded-full bg-blue-900/40 text-blue-400 text-xs hover:bg-blue-800/50">Kirish</button>
    </div>
  </div>

  <div id="loginForm" class="card mb-4" style="display:none">
    <h3 class="font-semibold mb-3">🔐 Tizimga kirish</h3>
    <input id="loginUser" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-600 text-white mb-3" placeholder="Login">
    <input id="loginPass" type="password" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-600 text-white mb-3" placeholder="Parol" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()" class="w-full py-3 rounded-xl font-semibold bg-blue-600 text-white">Kirish</button>
    <div id="loginError" class="mt-2 text-sm text-red-400"></div>
  </div>

  <div id="mainContent" style="display:none">
    <div class="tabs flex gap-2 mb-4">
      <button id="modeRegister" class="tab-btn active" onclick="setMode('register')">📝 Yozish</button>
      <button id="modeVerify" class="tab-btn" onclick="setMode('verify')">🔍 Tekshirish</button>
    </div>

    <div class="card mb-4">
      <div class="text-center">
        <video id="video" autoplay muted playsinline style="width:100%;max-width:480px;border-radius:12px;transform:scaleX(-1)"></video>
        <canvas id="captureCanvas" style="display:none"></canvas>
        <p id="statusText" class="text-sm mt-3 opacity-60">Kamera yoqilmoqda...</p>
      </div>
    </div>

    <div id="registerPanel" class="card mb-4">
      <h3 class="font-semibold mb-3">📝 Yuzni ro'yxatdan o'tkazish</h3>
      <select id="doctorSelect" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-600 text-white mb-3">
        <option value="">— Doktorni tanlang —</option>
      </select>
      <button id="captureBtn" class="w-full py-3 rounded-xl font-semibold bg-blue-600 text-white disabled:opacity-30" disabled onclick="captureFace()">
        📸 Rasmga olish
      </button>
      <div id="registerResult" class="mt-3 text-sm"></div>
    </div>

    <div id="verifyPanel" class="card mb-4" style="display:none">
      <h3 class="font-semibold mb-3">🔍 Yuzni tekshirish</h3>
      <p class="text-sm opacity-50 mb-3">Kameraga qarang va "Tekshirish" tugmasini bosing.</p>
      <div class="p-4 rounded-xl bg-slate-800/50 text-center min-h-[100px] flex flex-col items-center justify-center">
        <span class="text-4xl mb-2" id="verifyIcon">👤</span>
        <p class="text-lg font-bold" id="verifyName">—</p>
        <p class="text-sm opacity-50" id="verifyConfidence">Kutilmoqda...</p>
        <button id="verifyBtn" onclick="doVerify()" class="mt-4 px-6 py-3 rounded-xl font-semibold bg-emerald-600 text-white hover:bg-emerald-500">
          🔍 Tekshirish
        </button>
      </div>
    </div>

    <div class="card mt-4">
      <h3 class="font-semibold mb-3">📋 Bugungi kirishlar</h3>
      <div id="faceLogs" class="space-y-2 max-h-72 overflow-y-auto">
        <p class="text-sm opacity-40 text-center py-4">Yuklanmoqda...</p>
      </div>
    </div>
  </div>
</div>

<style>
.tabs .tab-btn {
  flex:1; padding:10px 16px; border-radius:10px; font-weight:600; font-size:14px;
  border:none; cursor:pointer; transition:all .2s;
  background:#334155; color:#94a3b8;
}
.tabs .tab-btn.active { background:#2563eb; color:#fff; }
.card h3 { color:#e2e8f0; }
</style>

<script>
const API = '';
let faceCapture = null;
let currentMode = 'register';
let isLoggedIn = false;

function getToken() { return localStorage.getItem('falcon_token') || ''; }

async function handleAuthError(res) {
  if (res.status === 401) { showLogin(); return true; }
  return false;
}

async function apiGet(url) {
  const token = getToken();
  const headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + url, { headers });
  if (await handleAuthError(res)) return {};
  return res.json();
}

async function apiPost(url, body) {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + url, { method: 'POST', headers, body: JSON.stringify(body) });
  if (await handleAuthError(res)) return { ok: false, status: 401, data: {} };
  return { ok: res.ok, status: res.status, data: await res.json() };
}

function handleAuth() {
  if (isLoggedIn) {
    localStorage.removeItem('falcon_token');
    location.reload();
  } else {
    document.getElementById('loginForm').style.display = 'block';
  }
}

async function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!user || !pass) { document.getElementById('loginError').textContent = 'Login va parolni kiriting'; return; }
  document.getElementById('loginError').textContent = 'Kirish...';
  document.querySelector('#loginForm button').disabled = true;
  try {
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data = await res.json();
    if (data.token) {
      localStorage.setItem('falcon_token', data.token);
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('loginError').textContent = '';
      document.getElementById('authBtn').textContent = 'Chiqish';
      document.getElementById('mainContent').style.display = 'block';
      startFaceApp();
    } else {
      document.getElementById('loginError').textContent = data.error || 'Xato login yoki parol';
    }
  } catch (e) {
    document.getElementById('loginError').textContent = 'Serverga ulanmadi. Internetni tekshiring.';
  }
  document.querySelector('#loginForm button').disabled = false;
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('registerPanel').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('verifyPanel').style.display = mode === 'verify' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === ('mode' + mode[0].toUpperCase() + mode.slice(1))));
}

async function doVerify() {
  const btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Tekshirilmoqda...';
  const photo = faceCapture?.capture();
  if (!photo) {
    document.getElementById('verifyName').textContent = 'Kameraga qarang';
    document.getElementById('verifyConfidence').textContent = 'Rasm olinmadi';
    document.getElementById('verifyIcon').textContent = '❌';
    btn.disabled = false;
    btn.textContent = '🔍 Tekshirish';
    return;
  }
  try {
    const nonce = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).substring(2);
    const d = await apiPost('/api/face/verify-photo', {
      photo_base64: photo,
      nonce,
      timestamp: Date.now()
    });
    if (d.ok && d.data.matched) {
      const name = d.data.identity?.name || 'Topildi';
      document.getElementById('verifyName').textContent = '✅ ' + name;
      document.getElementById('verifyConfidence').textContent = 'Ishonchlilik: ' + (d.data.confidence ? Math.round(d.data.confidence * 100) + '%' : '-');
      document.getElementById('verifyIcon').textContent = '✅';
    } else {
      document.getElementById('verifyName').textContent = '❌ Noma\'lum';
      document.getElementById('verifyConfidence').textContent = d.data?.error || 'Yuz tanilmadi';
      document.getElementById('verifyIcon').textContent = '❌';
    }
  } catch (e) {
    document.getElementById('verifyConfidence').textContent = 'Xatolik: ' + e.message;
    document.getElementById('verifyIcon').textContent = '⚠️';
  }
  btn.disabled = false;
  btn.textContent = '🔍 Tekshirish';
}

async function captureFace() {
  const doctorId = document.getElementById('doctorSelect').value;
  if (!doctorId) { document.getElementById('registerResult').innerHTML = '<span class="text-red-400">❌ Doktorni tanlang</span>'; return; }

  document.getElementById('registerResult').innerHTML = '<span class="text-blue-400">⏳ Rasm olinmoqda...</span>';
  document.getElementById('captureBtn').disabled = true;

  const photo = faceCapture?.capture();
  if (!photo) {
    document.getElementById('registerResult').innerHTML = '<span class="text-red-400">❌ Rasm olinmadi. Kamerani tekshiring.</span>';
    document.getElementById('captureBtn').disabled = false;
    return;
  }

  try {
    const nonce = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).substring(2);
    const d = await apiPost('/api/face/register-photo', {
      doctor_id: doctorId,
      photo_base64: photo,
      nonce,
      timestamp: Date.now()
    });

    document.getElementById('registerResult').innerHTML = d.ok
      ? '<span class="text-emerald-400">✅ Yuz modeli saqlandi!</span>'
      : '<span class="text-red-400">❌ ' + (d.data?.error || 'Xatolik') + '</span>';

    if (d.ok) await loadDoctors();
  } catch (e) {
    document.getElementById('registerResult').innerHTML = '<span class="text-red-400">❌ ' + e.message + '</span>';
  }
  document.getElementById('captureBtn').disabled = false;
}

async function loadDoctors() {
  try {
    const data = await apiGet('/api/face/doctors');
    const select = document.getElementById('doctorSelect');
    if (!data.doctors || data.doctors.length === 0) {
      select.innerHTML = '<option value="">Doktor topilmadi</option>';
      return;
    }
    select.innerHTML = '<option value="">— Doktorni tanlang —</option>';
    data.doctors.forEach(doc => {
      select.innerHTML += '<option value="' + doc.id + '">' + doc.first_name + ' ' + doc.last_name + ' (' + (doc.specialty || '—') + ') ' + (doc.face_enrolled ? '✅' : '❌') + '</option>';
    });
    document.getElementById('captureBtn').disabled = false;
  } catch (e) {
    console.error('Doctor load error:', e);
  }
}

async function loadFaceLogs() {
  try {
    const data = await apiGet('/api/face/logs');
    const logs = data.logs || [];
    const container = document.getElementById('faceLogs');
    if (!logs.length) {
      container.innerHTML = '<p class="text-sm opacity-40 text-center py-4">Bugun hech kim kirmagan</p>';
      return;
    }
    container.innerHTML = logs.map(log => {
      const isMatch = log.matched === 'yes';
      return '<div class="flex items-center gap-3 p-3 rounded-xl ' +
        (isMatch ? 'bg-emerald-900/20 border border-emerald-800/30' : 'bg-red-900/20 border border-red-800/30') +
        '"><span>' + '👤' + '</span>' +
        '<div class="flex-1"><p class="text-sm font-medium">' + (log.doctor_name || log.patient_id || 'Noma\'lum') + '</p>' +
        '<p class="text-xs opacity-50">' + new Date(log.created_at).toLocaleTimeString('uz-UZ') + ' · ' + (log.confidence ? Math.round(log.confidence * 100) + '%' : '-') + '</p></div>' +
        '<span class="text-xs ' + (isMatch ? 'text-emerald-400' : 'text-red-400') + '">' + (isMatch ? '✅' : '❌') + '</span></div>';
    }).join('');
  } catch (e) {
    document.getElementById('faceLogs').innerHTML = '<p class="text-sm opacity-40 text-center py-4">Ma\'lumot yuklanmadi</p>';
  }
}

function showLogin() {
  const statusEl = document.getElementById('modelStatus');
  const authBtn = document.getElementById('authBtn');
  statusEl.textContent = '❌ Kirish talab qilinadi';
  statusEl.className = 'px-3 py-1 rounded-full bg-red-900/40 text-red-400 text-xs';
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('mainContent').style.display = 'none';
  authBtn.textContent = '🔐 Kirish';
  isLoggedIn = false;
  localStorage.removeItem('falcon_token');
}

async function validateToken() {
  try {
    const res = await fetch(API + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    return res.ok;
  } catch { return false; }
}

async function init() {
  const statusEl = document.getElementById('modelStatus');
  const authBtn = document.getElementById('authBtn');
  const token = getToken();

  if (!token) {
    showLogin();
    return;
  }

  const valid = await validateToken();
  if (!valid) {
    showLogin();
    return;
  }

  isLoggedIn = true;
  authBtn.textContent = 'Chiqish';
  document.getElementById('mainContent').style.display = 'block';
  startFaceApp();
}

async function startFaceApp() {
  const statusEl = document.getElementById('modelStatus');
  const statusText = document.getElementById('statusText');
  const token = getToken();
  statusEl.textContent = '⏳ Kamera yoqilmoqda...';

  try {
    faceCapture = new FaceCapture({
      videoEl: document.getElementById('video'),
      canvasEl: document.getElementById('captureCanvas'),
      statusEl: statusText,
    });

    const ok = await faceCapture.init();
    if (!ok) {
      statusEl.textContent = '❌ Kamera yoqilmadi';
      return;
    }

    statusEl.textContent = '✅ Tayyor';
    statusEl.className = 'px-3 py-1 rounded-full bg-emerald-900/40 text-emerald-400 text-xs';

    await loadDoctors();
    loadFaceLogs();
    setInterval(loadFaceLogs, 30000);
  } catch (e) {
    statusEl.textContent = '❌ Xatolik: ' + (e.message || 'Noma\'lum');
    if (statusText) statusText.textContent = '❌ ' + e.message;
    console.error('Face ID init error:', e);
  }
}

init();
</script>
</body>
</html>
