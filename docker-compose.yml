x-common: &common
  restart: unless-stopped
  networks: [falcon]
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: falcon_ai_os
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falcon-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon_ai_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  stt:
    <<: *common
    build: ./stt-service
    ports: ["8081:8081"]
    environment:
      MODEL_NAME: hostmepanda/whisper-large-v3-turbo-uzbek-ct2
      MODEL_DIR: /cache
      DEVICE: cpu
      COMPUTE_TYPE: int8
    volumes:
      - stt-cache:/cache
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  app:
    <<: *common
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://falcon:${POSTGRES_PASSWORD:-falcon-secret}@db:5432/falcon_ai_os
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET required}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TELEGRAM_TOKEN_PATIENT: ${TELEGRAM_TOKEN_PATIENT:-}
      TELEGRAM_TOKEN_REFERRAL: ${TELEGRAM_TOKEN_REFERRAL:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
      FACE_ENCRYPTION_KEY: ${FACE_ENCRYPTION_KEY:-}
      SEED_CEO_PASSWORD: ${SEED_CEO_PASSWORD:-ceo-change-me-now}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-change-me-now}
      SEED_RECEPTION_PASSWORD: ${SEED_RECEPTION_PASSWORD:-reception-change-me-now}
      SEED_DOCTOR_PASSWORD: ${SEED_DOCTOR_PASSWORD:-doctor-change-me-now}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: info
      LOCAL_ONLY: "${LOCAL_ONLY:-true}"
      WHISPER_URL: http://stt:8081
      FACE_SVC_URL: http://face-svc:8082
    volumes:
      - falcon-backup:/backup
      - falcon-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      stt:
        condition: service_started
      face-svc:
        condition: service_started

  frontend:
    <<: *common
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://falconmedai.uz
    ports: ["3001:3001"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://falconmedai.uz
    depends_on:
      - app

  face-svc:
    <<: *common
    build: ./face-svc
    environment:
      MODEL_NAME: buffalo_l
    volumes:
      - face-models:/root/.insightface
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  caddy:
    <<: *common
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      APP_URL: http://app:3000

volumes:
  postgres-data:
  falcon-backup:
  falcon-logs:
  caddy-data:
  caddy-config:
  stt-cache:
  face-models:

networks:
  falcon:
    driver: bridge
