x-common: &common
  restart: unless-stopped
  networks: [falcon]
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: falcon_ai_os
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falcon-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon_ai_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  stt:
    <<: *common
    build: ./stt-service
    ports: ["8081:8081"]
    mem_limit: 2g
    environment:
      MODEL_NAME: hostmepanda/whisper-large-v3-turbo-uzbek-ct2
      MODEL_DIR: /cache
      DEVICE: cpu
      COMPUTE_TYPE: int8
      STT_CONCURRENCY: "2"
      MAX_AUDIO_MB: "25"
    volumes:
      - stt-cache:/cache
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  app:
    <<: *common
    build: .
    ports: ["3000:3000"]
    mem_limit: 700m
    environment:
      NODE_ENV: production
      PORT: 3000
      STT_LOCAL: "true"
      DATABASE_URL: postgresql://falcon:${POSTGRES_PASSWORD:-falcon-secret}@db:5432/falcon_ai_os
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET required}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TELEGRAM_TOKEN_PATIENT: ${TELEGRAM_TOKEN_PATIENT:-}
      TELEGRAM_TOKEN_REFERRAL: ${TELEGRAM_TOKEN_REFERRAL:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
      SEED_CEO_PASSWORD: ${SEED_CEO_PASSWORD:-ceo-change-me-now}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-change-me-now}
      SEED_RECEPTION_PASSWORD: ${SEED_RECEPTION_PASSWORD:-reception-change-me-now}
      SEED_DOCTOR_PASSWORD: ${SEED_DOCTOR_PASSWORD:-doctor-change-me-now}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # ─── To'lov provayderlari (bo'sh bo'lsa offline rejim) ───
      PAYME_MERCHANT_KEY: ${PAYME_MERCHANT_KEY:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      UZUM_TERMINAL_ID: ${UZUM_TERMINAL_ID:-}
      UZUM_SECRET: ${UZUM_SECRET:-}
      CLINIC_CARD_NUMBER: ${CLINIC_CARD_NUMBER:-}
      CLINIC_CARD_HOLDER: ${CLINIC_CARD_HOLDER:-}
      # ─── Email (SMTP) ───
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # ─── Boshqa ───
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@falconai.uz}
      PUBLIC_URL_OVERRIDE: ${TUNNEL_URL:-}
      LOG_LEVEL: info
      LOCAL_ONLY: "${LOCAL_ONLY:-true}"
      WHISPER_URL: http://stt:8081
    volumes:
      - falcon-backup:/backup
      - falcon-logs:/app/logs
      # Klinika logotiplari va PDF hisobotlar deploy'da yo'qolmasligi uchun
      - app-uploads:/app/public/uploads
      - app-reports:/app/public/reports
    depends_on:
      db:
        condition: service_healthy
      stt:
        condition: service_healthy

  frontend:
    <<: *common
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://falconmedai.uz
    ports: ["3001:3001"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://falconmedai.uz
    depends_on:
      - app

  caddy:
    <<: *common
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      APP_URL: http://app:3000

volumes:
  postgres-data:
  # Yuklangan fayllar image ichida emas — har deploy'da yo'qolmasligi uchun
  app-uploads:
  app-reports:
  falcon-backup:
  falcon-logs:
  caddy-data:
  caddy-config:
  stt-cache:

networks:
  falcon:
    driver: bridge
